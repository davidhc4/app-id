name: Compilar APK

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar
        env:
          FIRMA_KEYSTORE: ${{ secrets.FIRMA_KEYSTORE }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          chmod +x gradlew
          if [ -z "$FIRMA_KEYSTORE" ] || [ -z "$FIRMA_CLAVE" ]; then
            ./gradlew --no-daemon assembleDebug
            echo "::error::El código compila, pero faltan los secretos FIRMA_KEYSTORE y FIRMA_CLAVE para firmar y publicar el APK (ver README)."
            exit 1
          fi
          echo "$FIRMA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/placas.keystore"
          FIRMA_ARCHIVO="$RUNNER_TEMP/placas.keystore" ./gradlew --no-daemon assembleRelease

      - name: Preparar archivo
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "placas-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: placas-apk
          path: placas-v*.apk

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "placas-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Placas $VERSION" \
            --notes "Descarga el archivo .apk desde el celular y ábrelo para instalar o actualizar. No hace falta desinstalar la versión anterior."
